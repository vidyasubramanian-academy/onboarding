<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Serif+Devanagari:wght@600;700&family=Noto+Sans+Tamil:wght@400;600;700;800&family=Noto+Serif+Tamil:wght@600;700&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Noto+Serif+Telugu:wght@600;700&family=Noto+Sans+Kannada:wght@400;600;700;800&family=Noto+Serif+Kannada:wght@600;700&family=Noto+Sans+Malayalam:wght@400;600;700;800&family=Noto+Serif+Malayalam:wght@600;700&display=swap">
<style>
/* Layout: one centred card at a time, brand header above with a language switch at top right, progress + controls below. Single brand theme (VSA screening-call palette), set explicitly. */
:root{
  --maroon:#6E1F2D; --maroon-2:#852C3B; --maroon-soft:#F1E3E0;
  --cream:#F8F3EA; --sand:#F3E9DA; --paper:#FFFCF5; --line:#E8DCC6;
  --gold:#E0C27A; --gold-ink:#8B6420; --bronze:#B88A3E;
  --ink:#2A1E1A; --muted:#6B5A50; --on-maroon:#FBF4E8; --on-maroon-muted:#E9D3CF;
  --good:#2F6B45; --good-bg:#E6F0E6; --bad:#9A2F2F; --bad-bg:#F7E4E1;
  --display:"Cormorant Garamond","Noto Serif Devanagari","Noto Serif Tamil","Noto Serif Telugu","Noto Serif Kannada","Noto Serif Malayalam",Georgia,"Times New Roman",serif;
  --body:"Nunito","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:18px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{width:100%;max-width:920px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .seal{width:44px;height:44px;border-radius:50%;background:var(--maroon);display:grid;place-items:center;flex:none}
.brand .seal img{width:30px}
.brand b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:12px;flex:none}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lang{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;color:var(--maroon);font-weight:700;font-size:14px;cursor:pointer}
.lang:hover{border-color:var(--bronze)}
.lang:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.lang svg{flex:none}
.lang select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:0 16px 0 0;outline:none}
.lang::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{width:100%;max-width:920px;flex:1;display:flex}
.card{position:relative;width:100%;min-height:min(560px,72vh);background:var(--cream);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px -24px rgba(110,31,45,.35);padding:clamp(24px,5vw,52px);padding-bottom:56px;display:flex;flex-direction:column;gap:18px;overflow:hidden;animation:in .35s ease}
.card.dark{background:var(--maroon);border-color:var(--maroon);color:var(--on-maroon)}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.flip-inner{animation:none!important;transition:none!important}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-ink)}
.dark .eyebrow{color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:700;color:var(--maroon);margin:0;line-height:1.08;text-wrap:balance}
.dark h1,.dark h2{color:var(--on-maroon)}
h1{font-size:clamp(40px,7vw,68px)}
h2{font-size:clamp(28px,4.4vw,42px)}
.rule{width:96px;height:3px;background:var(--gold);border:0;margin:0}
.lead{font-size:clamp(17px,2.1vw,20px);color:var(--muted);max-width:60ch;margin:0}
.dark .lead{color:var(--on-maroon-muted)}
.body{display:flex;flex-direction:column;gap:16px;flex:1;min-width:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:680px){.cols{grid-template-columns:1fr}}
.points{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.points li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:600}
.points li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--bronze)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(64px,11vw,108px);line-height:.9;color:var(--maroon)}
.big-cap{color:var(--muted);font-size:17px;max-width:30ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sand);color:var(--maroon);font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px}
.dark .chip{background:var(--maroon-2);color:var(--on-maroon)}
.quote{font-family:var(--display);font-style:italic;font-size:clamp(24px,3.6vw,36px);line-height:1.25;margin:0;max-width:26ch}
.callout{background:var(--maroon);color:var(--on-maroon);border-radius:16px;padding:18px 20px}
.callout .tag{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.callout p{margin:0;font-size:17px}
.dd{border-radius:16px;padding:18px 20px;border:1px solid var(--line);background:var(--paper)}
.dd h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.dd.do h3{color:var(--good)} .dd.dont h3{color:var(--bad)}
.dd ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.dd li{display:flex;gap:10px;font-weight:600}
.dd.do li::before{content:"✓";color:var(--good);font-weight:800}
.dd.dont li::before{content:"✕";color:var(--bad);font-weight:800}
.flip{perspective:1400px;flex:1;display:flex;min-height:260px}
.flip-inner{position:relative;flex:1;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer;border-radius:18px}
.flip-inner:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.face.front{background:var(--paper);border:1px dashed var(--bronze)}
.face.back{background:var(--maroon);color:var(--on-maroon);transform:rotateY(180deg)}
.face .q{font-family:var(--display);font-weight:600;font-size:clamp(24px,3.4vw,32px);line-height:1.2;color:var(--maroon)}
.face.back .a{font-size:18px}
.face.back .a b{color:var(--gold)}
.hint{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.face.back .hint{color:var(--gold)}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--bronze)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:var(--maroon);font-size:13px;font-weight:800}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px 16px;font-size:16px}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.fb span{color:var(--ink)}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--bronze)}
.small{font-size:13px;color:var(--muted)}
.dark .small{color:var(--on-maroon-muted)}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:r}
.recap li{counter-increment:r;display:flex;gap:14px;align-items:baseline;font-size:18px;font-weight:600}
.recap li::before{content:counter(r);font-family:var(--display);font-weight:700;font-size:28px;color:var(--bronze);min-width:20px}
.cover-logo{width:150px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--on-maroon-muted);font-size:14px;margin-top:auto}
.cta-btn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:var(--gold);color:var(--ink);font-weight:800;font-size:18px;text-decoration:none;padding:14px 26px;border-radius:999px;transition:transform .15s}
.cta-btn:hover{transform:translateY(-2px)}
.cta-btn:focus-visible{outline:3px solid var(--on-maroon);outline-offset:3px}
.score{display:inline-block;align-self:flex-start;background:var(--maroon-2);border-radius:12px;padding:10px 14px;font-weight:700}
.foot{position:absolute;left:clamp(24px,5vw,52px);right:clamp(24px,5vw,52px);bottom:16px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);pointer-events:none}
.dark .foot{color:var(--on-maroon-muted)}
.controls{width:100%;max-width:920px;display:flex;align-items:center;gap:14px}
.nav{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:112px;padding:11px 18px;border-radius:999px;font-weight:800;cursor:pointer;background:var(--maroon);color:var(--on-maroon)}
.nav.ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon)}
.nav[disabled]{opacity:.35;cursor:not-allowed}
.nav:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.track{flex:1;display:flex;gap:5px;min-width:0}
.track i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track i.done{background:var(--bronze)} .track i.now{background:var(--maroon)}
.gate{font-size:13px;color:var(--gold-ink);font-weight:700;text-align:center;min-height:18px}
.fq-form{display:grid;gap:12px;max-width:440px}
.fq-form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--on-maroon-muted)}
.fq-form input{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px}
.fq-form input:focus{outline:3px solid var(--gold);outline-offset:1px}
.fq-err{color:var(--gold);font-weight:700;font-size:14px;min-height:20px}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--gold);color:var(--ink);font-weight:800;font-size:17px;padding:12px 24px;border-radius:999px;cursor:pointer}
.btn.alt{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card:not(.dark) .btn{background:var(--maroon);color:var(--on-maroon)}
.opt.picked{border-color:var(--maroon);background:var(--maroon-soft)} .opt.picked .k{background:var(--maroon);color:var(--on-maroon)}
.qbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--bronze)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.result-top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.result-score{font-family:var(--display);font-weight:700;font-size:clamp(64px,11vw,100px);line-height:.9;color:var(--gold)}
.badge{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.badge.pass{background:var(--good-bg);color:var(--good)} .badge.fail{background:var(--gold);color:var(--ink)}
.review{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.review li{background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;border-left:4px solid var(--good)}
.review li.x{border-left-color:var(--bad)}
.review b{display:block;margin-bottom:2px}
.review .ans{color:var(--muted)}
.notice{background:var(--maroon-2);border-radius:12px;padding:10px 14px;font-size:14px}
.pledge{display:flex;gap:12px;align-items:flex-start;background:var(--maroon-soft);border:1.5px solid var(--maroon);border-radius:14px;padding:14px 16px;font-weight:700;color:var(--maroon);cursor:pointer}
.pledge input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--maroon);cursor:pointer}
.pledge:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.fq-form .pledge{background:var(--maroon-2);border-color:var(--gold);color:var(--on-maroon);font-weight:600;font-size:14px}
.fq-form .pledge input{accent-color:var(--gold)}
.sign{font-family:var(--display);font-style:italic;font-size:20px;color:var(--maroon)}
/* Indian scripts: taller line height, no letter-spacing, upright text, a smaller display scale */
:root:not([lang="en"]) body{line-height:1.7}
:root:not([lang="en"]) .eyebrow,:root:not([lang="en"]) .callout .tag,:root:not([lang="en"]) .dd h3,:root:not([lang="en"]) .badge{letter-spacing:0;font-size:13px}
:root:not([lang="en"]) h1{font-size:clamp(30px,5.2vw,50px);line-height:1.3}
:root:not([lang="en"]) h2{font-size:clamp(22px,3.4vw,32px);line-height:1.35}
:root:not([lang="en"]) .quote{font-style:normal;font-size:clamp(20px,2.8vw,28px);line-height:1.55}
:root:not([lang="en"]) .face .q{font-size:clamp(19px,2.5vw,24px);line-height:1.5}
:root:not([lang="en"]) .sign{font-style:normal;font-size:17px}
:root:not([lang="en"]) .lead{font-size:clamp(16px,1.9vw,18px)}
:root:not([lang="en"]) .points li,:root:not([lang="en"]) .opt,:root:not([lang="en"]) .recap li{font-size:15px}
:root:not([lang="en"]) .recap li::before{font-family:"Cormorant Garamond",Georgia,serif}
@media (max-width:520px){.nav{min-width:0;padding:10px 14px}.nav .lbl{display:none}.card{min-height:auto}.count{display:none}}
</style>

<script>
const DECK = {"id": "m3-anti-harassment", "module": "VSA Teacher Orientation · Module 3", "title": "Anti-harassment Policy", "subtitle": "What harassment looks like, where the policy applies, and what to do if you experience or see it.", "minutes": 7, "cards": [{"type": "cover"}, {"type": "welcome"}, {"type": "flip", "eyebrow": "Before we begin", "title": "Think first, then flip", "front": "A student's parent sends you WhatsApp jokes mocking another student's religion. It's outside class time. Does VSA's policy cover this?", "back": "**Yes.** The policy covers conduct by people outside VSA, such as students and parents, and harassing messages sent by text, phone, email or social media."}, {"type": "quote", "eyebrow": "Our commitment", "quote": "Each individual has the right to work in a professional atmosphere that promotes equal opportunities.", "text": "This applies to every VSA associate, teacher and student. VSA expects all relationships to be **business-like** and free of bias, prejudice and harassment."}, {"type": "concept", "eyebrow": "Sexual harassment", "title": "What it can look like", "text": "Unwelcome sexual advances, requests or conduct of a sexual nature. It can be subtle, and can involve people of the same or different gender.", "points": ["Sexual jokes and innuendo", "Comments about someone's body", "Unwanted advances or requests for favours", "Obscene comments, gestures or images"]}, {"type": "quiz", "question": "Which of these could count as sexual harassment?", "options": ["Asking a student to repeat a phrase until it's right", "Commenting on a student's body during class", "Ending a class exactly on time"], "answer": 1, "right": "Exactly.", "wrong": "Not quite.", "explain": "Commentary about an individual's body is listed in the policy as a form of sexual harassment, whoever it's directed at."}, {"type": "concept", "eyebrow": "Harassment based on who someone is", "title": "Protected characteristics", "text": "Hostile or demeaning conduct because of someone's identity, or that of their relatives, friends or associates, is strictly prohibited.", "chips": ["Race and colour", "Religion", "Sex", "Sexual orientation", "Gender identity", "Age", "Disability", "Marital status", "Citizenship", "National origin"], "points": ["Slurs or negative stereotyping", "Denigrating jokes", "Threats or intimidation", "Demeaning emails, texts, voice notes or posts"]}, {"type": "dodont", "eyebrow": "Inclusion, not avoidance", "title": "Respect everyone equally", "text": "Never exclude people to avoid allegations of harassment. That is discrimination too.", "do": ["Treat every student and colleague with the same professionalism", "Keep conversations business-like", "Include everyone in work discussions and events"], "dont": ["Turn away students because of their gender or background", "Share 'harmless' jokes about religion or nationality", "Comment on anyone's body or looks"]}, {"type": "quiz", "eyebrow": "Scenario", "question": "Does the policy apply here?", "scenario": "At a VSA music event, a fellow teacher keeps making sexual jokes to you. It isn't a class.", "options": ["Yes, it covers work-related settings such as events and meetings", "No, it only applies during classes", "Only if a student is present"], "answer": 0, "right": "Well judged.", "wrong": "Think again about where the policy applies.", "explain": "Prohibited conduct is unacceptable at work and in any work-related setting, including business meetings and work-related social events."}, {"type": "concept", "eyebrow": "If it happens to you, or you see it", "title": "Speak up early", "points": ["If you feel able, tell the person their behaviour is unwelcome and ask them to stop", "Discuss your concern with the **Core VSA Team**", "Report what you witness, not only what happens to you", "Report whoever the person is, whatever their position"]}, {"type": "quiz", "question": "When should a concern be reported?", "options": ["Within 48 hours, or it can't be looked into", "Only after it has happened three times", "There's no fixed period, but reporting early works best"], "answer": 2, "right": "That's right.", "wrong": "Not quite.", "explain": "No fixed reporting period is set, but early reporting gives the best chance of resolving things before relationships become strained."}, {"type": "concept", "eyebrow": "After you report", "title": "What VSA does next", "points": ["Every report is investigated promptly", "This may include interviews with those involved and witnesses", "Confidentiality is kept as far as the investigation allows", "If you disagree with the outcome, you can appeal to VSA's Founder"]}, {"type": "quiz", "eyebrow": "Scenario", "question": "What is this?", "scenario": "After a teacher reports a colleague's comments, the colleague starts making snide remarks and leaving them out of team discussions.", "options": ["Retaliation, a serious violation to report immediately", "A personal disagreement to settle privately", "Understandable, since the report caused friction"], "answer": 0, "right": "Exactly.", "wrong": "Think about why it's happening.", "explain": "Retaliating against someone for reporting or taking part in an investigation is a serious violation, treated like harassment itself."}, {"type": "reflect", "prompt": "If a parent's comments made you uncomfortable during a class, what would you say in the moment?", "nudge": "Stay calm and professional, say clearly that the comments are unwelcome and ask them to stop, then let the Core VSA Team know."}, {"type": "recap", "points": ["Treat everyone with respect; keep relationships business-like", "The policy covers students, parents, events and messages, not just classes", "Never exclude anyone to avoid allegations", "Report to the Core VSA Team, early, including what you witness", "Retaliation is never acceptable; good-faith reports are protected"]}, {"type": "cta", "title": "Take the quiz"}], "finalQuiz": {"passMark": 70, "allowRetake": true, "resultsEndpoint": "https://script.google.com/macros/s/AKfycbzuv8WdWCXQLqW3mOdTj-RiEhozDwJAO3XZlrLA0namYAGdwzycEXOHDqhe9LKR4rvb/exec", "intro": "Eight questions on the anti-harassment policy. Choose the best answer for each.", "questions": [{"question": "Who should you discuss a harassment concern with?", "options": ["The parent of the student involved", "The Core VSA Team", "Other teachers in a group chat", "Nobody, unless it happens again"], "answer": 1, "explain": "The policy asks anyone who experiences or witnesses prohibited conduct to discuss it with the Core VSA Team."}, {"question": "Which of these is harassment under the policy?", "options": ["Jokes that stereotype a student's nationality", "Honest feedback on a student's singing", "Moving a class with 48 hours' notice"], "answer": 0, "explain": "Negative stereotyping and denigrating jokes based on national origin are prohibited harassing conduct."}, {"question": "During class, a student's parent keeps commenting on your appearance in a way that makes you uncomfortable. What's the best response?", "options": ["Ignore it, since parents aren't covered by the policy", "Stop teaching the student without telling anyone", "Say the comments are unwelcome, ask them to stop, and inform the Core VSA Team"], "answer": 2, "explain": "The policy covers parents, encourages telling the person their behaviour is unwelcome, and asks you to raise it with the Core VSA Team."}, {"question": "Are harassing messages sent by WhatsApp, email or social media covered?", "options": ["Only if sent during class hours", "Yes, messages by text, phone, email or social media are covered", "No, only face-to-face conduct counts"], "answer": 1, "explain": "The policy names e-mail, phone, voice messages, text messages and social networking sites as ways harassment can happen."}, {"question": "To avoid any risk of complaints, a teacher decides not to accept students of a particular gender. Is this acceptable?", "options": ["No, the policy must never be used to exclude people by gender", "Yes, it's a sensible precaution", "Yes, as long as VSA is told"], "answer": 0, "explain": "Excluding people to avoid harassment allegations is itself discrimination, which the policy prohibits."}, {"question": "At a VSA event, you hear a colleague make demeaning jokes about another teacher's religion. You weren't the target. What should you do?", "options": ["Nothing, only the person targeted can report", "Wait to see if it happens again", "Raise it with the Core VSA Team"], "answer": 2, "explain": "The policy asks people who witness prohibited conduct to report it, and it applies at work-related events."}, {"question": "You report a concern in good faith, but it later turns out you misunderstood the situation. What happens?", "options": ["You'll face disciplinary action", "You're protected; only false and malicious complaints may lead to discipline", "Your report is shared with all teachers"], "answer": 1, "explain": "Complaints made in good faith are protected even if mistaken; only false and malicious complaints may be disciplined."}, {"question": "If you disagree with how VSA resolved a complaint, what can you do?", "options": ["Post about it on social media", "Drop the matter", "Ask the other person to settle it privately", "Appeal to VSA's Founder"], "answer": 3, "explain": "A party who disagrees with the resolution may appeal to VSA's Founder."}]}, "translations": {"hi": {"module": "VSA शिक्षक ओरिएंटेशन · मॉड्यूल 3", "title": "उत्पीड़न-विरोधी नीति", "subtitle": "उत्पीड़न कैसा दिखता है, नीति कहाँ लागू होती है, और अगर आप इसका सामना करें या इसे होते देखें तो क्या करें।", "footer": "शिक्षक ओरिएंटेशन", "cards": [{}, {}, {"eyebrow": "शुरू करने से पहले", "title": "पहले सोचें, फिर पलटें", "front": "एक विद्यार्थी के अभिभावक आपको WhatsApp पर ऐसे चुटकुले भेजते हैं जो किसी दूसरे विद्यार्थी के धर्म का मज़ाक उड़ाते हैं। यह कक्षा के समय के बाहर है। क्या VSA की नीति इस पर लागू होती है?", "back": "**हाँ।** यह नीति VSA से बाहर के लोगों, जैसे विद्यार्थियों और const FQT = f => (LT() && LT().finalQuiz && LT().finalQuiz[f]) || (FQ && FQ[f]);
const QL = k => Object.assign({}, FQ.questions[k], (LT() && LT().finalQuiz && LT().finalQuiz.questions && LT().finalQuiz.questions[k]) || {}, { answer: FQ.questions[k].answer });
if (!state.fq) state.fq = { phase: "intro", name: "", email: "", k: 0, picks: [], attempts: 0, result: null, sent: "" };

function chrome() {
  document.documentElement.lang = lang;
  $("mod").textContent = D("module") || t("orientation");
  $("ttl").textContent = D("title");
  document.title = D("title");
  $("prev").querySelector(".lbl").textContent = t("back");
  $("next").querySelector(".lbl").textContent = t("next");
  $("langlbl").textContent = t("language");
  const sel = $("lang");
  if (AVAIL.length > 1) {
    $("langwrap").hidden = false;
    sel.innerHTML = AVAIL.map(k => `<option value="${k}" lang="${k}">${LANG_NAMES[k]}</option>`).join("");
    sel.value = lang;
  }
}
function setLang(l) {
  if (!AVAIL.includes(l)) return;
  lang = l;
  try { localStorage.setItem("vsa-lang", l); } catch (e) {}
  chrome(); render();
}
$("lang").addEventListener("change", e => setLang(e.target.value));

function fqHtml(c) {
  const f = state.fq, Q = FQ.questions, M = Q.length;
  if (f.phase === "q") {
    const q = QL(f.k), p = f.picks[f.k];
    return `<div class="eyebrow">${esc(t("qOf", { a: f.k + 1, b: M }))}</div>
      <div class="qbar" aria-hidden="true"><i style="width:${(f.k / M) * 100}%"></i></div>
      <h2>${md(q.question)}</h2>
      <div class="opts">${q.options.map((o, k) => `<button class="opt fq-opt ${p === k ? "picked" : ""}" type="button" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${md(o)}</span></button>`).join("")}</div>
      <div class="row"><button class="btn" id="fq-next" type="button" ${p === undefined ? "disabled" : ""}>${esc(f.k === M - 1 ? t("submit") : t("nextQ"))} →</button>
      ${f.k > 0 ? `<button class="btn alt" id="fq-back" type="button">← ${esc(t("prevQ"))}</button>` : ""}</div>`;
  }
  if (f.phase === "result" && f.result) {
    const r = f.result;
    const msg = { sent: t("sent"), failed: t("failed"), none: (lang === "en" && FQ.noEndpointNote) || t("none"), sending: t("sending") }[f.sent] || "";
    const canRetake = FQ.allowRetake !== false && (!FQ.maxAttempts || f.attempts < FQ.maxAttempts);
    return `<div class="eyebrow">${esc(t("moduleQuiz"))} · ${esc(r.name)}</div>
      <h1>${esc(r.passed ? (FQT("passTitle") || t("passTitle")) : (FQT("failTitle") || t("failTitle")))}</h1>
      <div class="result-top"><div class="result-score">${r.score}/${r.total}</div>
        <div><span class="badge ${r.passed ? "pass" : "fail"}">${esc(r.passed ? t("passed") : t("below"))}</span>
        <p class="small" style="margin:6px 0 0">${esc(t("resultLine", { p: r.percent, m: r.passMark, a: r.attempt }))}</p></div></div>
      <p class="lead">${md(r.passed ? (FQT("passText") || t("passText")) : (FQT("failText") || t("failText")))}</p>
      ${msg ? `<div class="notice">${esc(msg)}</div>` : ""}
      <ul class="review">${Q.map((_, k) => { const q = QL(k), pick = r.picks[k], ok = pick === q.answer; return `<li class="${ok ? "" : "x"}"><b>${ok ? "✓" : "✕"} ${md(q.question)}</b>
        <span class="ans">${ok ? esc(t("yourAnswer")) + " " + md(q.options[pick]) : esc(t("youAnswered")) + " " + md(q.options[pick]) + " · " + esc(t("correct")) + " " + md(q.options[q.answer])}</span>${q.explain ? `<br><span class="ans">${md(q.explain)}</span>` : ""}</li>`; }).join("")}</ul>
      <div class="row">${canRetake ? `<button class="btn" id="fq-retake" type="button">${esc(t("retake"))}</button>` : ""}<button class="btn alt" id="fq-review" type="button">${esc(t("backToCards"))}</button></div>`;
  }
  const got = quizCards.filter(k => state.answers[k] === cards[k].answer).length;
  return `<div class="eyebrow">${esc(c.eyebrow || t("ctaEyebrow"))}</div>
    <h1>${esc(c.title || t("ctaTitle"))}</h1><hr class="rule">
    <p class="lead">${md(c.text || FQT("intro") || t("ctaIntro"))}</p>
    <div class="meta" style="margin-top:0"><span>${esc(t("questionsN", { n: M }))}</span><span>${esc(t("passMarkN", { n: PASS }))}</span>${quizCards.length ? `<span>${esc(t("practice", { a: got, b: quizCards.length }))}</span>` : ""}</div>
    <form class="fq-form" id="fq-form" novalidate>
      <label for="fq-name">${esc(t("name"))}<input id="fq-name" autocomplete="name" value="${esc(f.name)}" required></label>
      <label for="fq-email">${esc(t("email"))}<input id="fq-email" type="email" autocomplete="email" value="${esc(f.email)}" required></label>
      <label class="pledge" for="fq-self"><input type="checkbox" id="fq-self"><span>${esc(t("self"))}</span></label>
      <div class="fq-err" id="fq-err"></div>
      <button class="btn" type="submit">${esc(t("start"))} →</button>
    </form>`;
}

async function sendResult(r) {
  const url = FQ.resultsEndpoint || "";
  if (!url) { state.fq.sent = "none"; return; }
  state.fq.sent = "sending"; render();
  try {
    await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(r) });
    state.fq.sent = "sent";
  } catch (e) { state.fq.sent = "failed"; }
  render();
}

function finishQuiz() {
  const f = state.fq, Q = FQ.questions;
  /* Results are always recorded in English so the results sheet stays consistent; the teacher's language is sent alongside. */
  const answers = Q.map((q, k) => ({ question: q.question.replace(/\*\*/g, ""), chosen: q.options[f.picks[k]], correct: q.options[q.answer], isCorrect: f.picks[k] === q.answer }));
  const score = answers.filter(a => a.isCorrect).length;
  const percent = Math.round((score / Q.length) * 100);
  f.attempts += 1;
  f.result = { moduleId: DECK.id || "", module: DECK.module || "", title: DECK.title, name: f.name, email: f.email, language: LANG_NAMES[lang] || lang, score, total: Q.length, percent, passMark: PASS, passed: percent >= PASS, attempt: f.attempts, selfDeclared: true, answers, picks: f.picks.slice(), submittedAt: new Date().toISOString() };
  f.phase = "result";
  if (f.result.passed) sendResult(f.result); else f.sent = "";
  render();
}

function render() {
  const i = state.i, c = C(i);
  const dark = c.type === "cover" || c.type === "quote" || (c.type === "cta" && !(FQ && state.fq.phase === "q"));
  let h = "";
  const eb = c.eyebrow ? `<div class="eyebrow">${esc(c.eyebrow)}</div>` : "";
  switch (c.type) {
    case "cover":
      h = `<img class="cover-logo" alt="VSA logo" src="${LOGO}">
        <div class="eyebrow">${esc(D("module") || t("orientation"))}</div>
        <h1>${esc(c.title || D("title"))}</h1><hr class="rule">
        <p class="lead">${md(c.text || D("subtitle") || "")}</p>
        <div class="meta"><span>${esc(t("cards", { n: N }))}</span><span>${esc(t("minutes", { n: DECK.minutes || Math.max(4, Math.round(N * 0.5)) }))}</span><span>${esc(t("quizEnd"))}</span></div>`;
      break;
    case "welcome":
      h = `<div class="eyebrow">${esc(c.eyebrow || t("wEyebrow"))}</div>
        <h2>${esc(c.title || t("wTitle"))}</h2><div class="body">
        <p class="lead">${md(c.text || t("wText"))}</p>
        ${points(c.points || t("wPoints"))}
        <label class="pledge" for="pledge"><input type="checkbox" id="pledge" ${state.pledged ? "checked" : ""}><span>${esc(c.confirm || t("wConfirm"))}</span></label>
        <div class="sign">${esc(c.signoff || t("wSignoff"))}</div></div>`;
      break;
    case "concept":
      h = `${eb}<h2>${esc(c.title)}</h2><div class="body">
        ${c.text ? `<p class="lead">${md(c.text)}</p>` : ""}
        ${c.big ? `<div class="cols"><div><div class="big">${esc(c.big)}</div><div class="big-cap">${md(c.bigCaption || "")}</div></div><div>${points(c.points)}</div></div>` : points(c.points)}
        ${chips(c.chips)}${callout(t("thinkAbout"), c.think)}</div>`;
      break;
    case "quote":
      h = `${eb}<div class="body" style="justify-content:center"><p class="quote">“${esc(c.quote)}”</p>
        ${c.text ? `<p class="lead">${md(c.text)}</p>` : ""}${chips(c.chips)}</div>`;
      break;
    case "dodont":
      h = `${eb}<h2>${esc(c.title)}</h2><div class="body">${c.text ? `<p class="lead">${md(c.text)}</p>` : ""}
        <div class="cols"><div class="dd do"><h3>${esc(c.doLabel || t("do"))}</h3><ul>${(c.do || []).map(x => `<li><span>${md(x)}</span></li>`).join("")}</ul></div>
        <div class="dd dont"><h3>${esc(c.dontLabel || t("dont"))}</h3><ul>${(c.dont || []).map(x => `<li><span>${md(x)}</span></li>`).join("")}</ul></div></div></div>`;
      break;
    case "flip":
      h = `${eb}<h2>${esc(c.title || t("flipTitle"))}</h2>
        <div class="flip ${state.flipped[i] ? "on" : ""}" id="flip"><div class="flip-inner" tabindex="0" role="button" aria-pressed="${!!state.flipped[i]}" aria-label="${esc(t("flipHint"))}">
          <div class="face front"><div class="q">${md(c.front)}</div><div class="hint">${esc(t("flipHint"))}</div></div>
          <div class="face back"><div class="hint">${esc(c.backLabel || t("flipBack"))}</div><div class="a">${md(c.back)}</div></div>
        </div></div>`;
      break;
    case "quiz": {
      const a = state.answers[i];
      const answered = a !== undefined;
      h = `<div class="eyebrow">${esc(c.eyebrow || (c.scenario ? t("scenario") : t("quickCheck")))}</div>
        <h2>${md(c.question)}</h2>${c.scenario ? `<p class="lead">${md(c.scenario)}</p>` : ""}
        <div class="opts">${c.options.map((o, k) => {
          const cls = answered ? (k === c.answer ? "right" : (k === a ? "wrong" : "")) : "";
          return `<button class="opt ${cls}" type="button" data-k="${k}" ${answered ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${md(o)}</span></button>`;
        }).join("")}</div>
        ${answered ? `<div class="fb ${a === c.answer ? "ok" : "no"}"><b>${a === c.answer ? esc(c.right || t("right")) : esc(c.wrong || t("wrong"))}</b><span>${md(c.explain)}</span></div>` : ""}`;
      break;
    }
    case "reflect":
      h = `<div class="eyebrow">${esc(c.eyebrow || t("reflectEyebrow"))}</div><h2>${md(c.prompt)}</h2><div class="body">
        ${c.text ? `<p class="lead">${md(c.text)}</p>` : ""}
        <label class="small" for="note">${esc(t("reflectLabel"))}</label>
        <textarea id="note" placeholder="${esc(c.placeholder || t("reflectPlaceholder"))}">${esc(state.notes[i] || "")}</textarea>
        ${c.nudge ? `<p class="small"><b>${esc(t("reflectNudge"))}</b> ${md(c.nudge)}</p>` : ""}</div>`;
      break;
    case "recap":
      h = `<div class="eyebrow">${esc(c.eyebrow || t("recapEyebrow"))}</div><h2>${esc(c.title || t("recapTitle"))}</h2>
        <ol class="recap">${(c.points || []).map(p => `<li><span>${md(p)}</span></li>`).join("")}</ol>`;
      break;
    case "cta": {
      if (FQ) { h = fqHtml(c); break; }
      const got = quizCards.filter(k => state.answers[k] === cards[k].answer).length;
      const url = DECK.quizUrl && DECK.quizUrl.startsWith("http") ? DECK.quizUrl : "";
      h = `<div class="eyebrow">${esc(c.eyebrow || t("finishedModule"))}</div>
        <h1>${esc(c.title || t("ctaTitle"))}</h1><hr class="rule">
        <p class="lead">${md(c.text || t("ctaIntro"))}</p>
        ${quizCards.length ? `<div class="score">${esc(t("practice", { a: got, b: quizCards.length }))}</div>` : ""}
        ${url ? `<a class="cta-btn" href="${esc(url)}" target="_blank" rel="noopener">${esc(c.button || t("ctaTitle"))} →</a>`
              : `<span class="cta-btn" style="opacity:.6">${esc(t("comingSoon"))}</span>`}
        <p class="small">${md(c.note || t("needHelp"))}</p>`;
      break;
    }
  }
  $("stage").innerHTML = `<article class="card ${dark ? "dark" : ""}">${h}<div class="foot"><span>VSA · ${esc(D("footer") || t("footer"))}</span><span>${String(i + 1).padStart(2, "0")}</span></div></article>`;
  $("count").textContent = `${i + 1} / ${N}`;
  [...$("track").children].forEach((el, k) => el.className = k < i ? "done" : k === i ? "now" : "");
  $("prev").disabled = i === 0;
  const gatedQ = c.type === "quiz" && state.answers[i] === undefined;
  const gatedW = c.type === "welcome" && !state.pledged;
  $("next").disabled = i === N - 1 || gatedQ || gatedW;
  $("gate").textContent = gatedQ ? t("gateQuiz") : gatedW ? t("gateWelcome") : "";
  bind(c, i);
  save();
}

function bind(c, i) {
  if (c.type === "flip") {
    const f = $("flip"), inner = f.querySelector(".flip-inner");
    const tg = () => { state.flipped[i] = !state.flipped[i]; f.classList.toggle("on"); inner.setAttribute("aria-pressed", !!state.flipped[i]); save(); };
    inner.addEventListener("click", tg);
    inner.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); tg(); } });
  }
  if (c.type === "quiz") document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { state.answers[i] = +b.dataset.k; render(); }));
  if (c.type === "reflect") $("note").addEventListener("input", e => { state.notes[i] = e.target.value; save(); });
  if (c.type === "welcome") $("pledge").addEventListener("change", e => { state.pledged = e.target.checked; render(); $("pledge").focus(); });
  if (c.type === "cta" && FQ) {
    const f = state.fq;
    if (f.phase === "intro") $("fq-form").addEventListener("submit", e => {
      e.preventDefault();
      const name = $("fq-name").value.trim(), email = $("fq-email").value.trim();
      if (!name) { $("fq-err").textContent = t("errName"); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $("fq-err").textContent = t("errEmail"); return; }
      if (!$("fq-self").checked) { $("fq-err").textContent = t("errSelf"); return; }
      Object.assign(f, { name, email, phase: "q", k: 0, picks: [], result: null, sent: "" });
      render();
    });
    if (f.phase === "q") {
      document.querySelectorAll(".fq-opt").forEach(b => b.addEventListener("click", () => { f.picks[f.k] = +b.dataset.k; render(); }));
      $("fq-next").addEventListener("click", () => { if (f.picks[f.k] === undefined) return; if (f.k < FQ.questions.length - 1) { f.k++; render(); } else finishQuiz(); });
      if ($("fq-back")) $("fq-back").addEventListener("click", () => { f.k--; render(); });
    }
    if (f.phase === "result") {
      if ($("fq-retake")) $("fq-retake").addEventListener("click", () => { Object.assign(f, { phase: "q", k: 0, picks: [], result: null, sent: "" }); render(); });
      $("fq-review").addEventListener("click", () => { state.i = 1; render(); });
    }
  }
}
const go = d => { const n = state.i + d; if (n < 0 || n >= N) return; if (d > 0 && $("next").disabled) return; state.i = n; render(); };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
document.addEventListener("keydown", e => {
  if (["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
let sx = null;
$("stage").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("stage").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); sx = null; });
chrome();
render();
</script>
